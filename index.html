<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />

    <!-- PWA & Mobile App -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="로컬리" />
    <meta name="theme-color" content="#0A0A0E" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <!-- SEO & Social -->
    <meta name="description" content="AI 현지인 가이드 - 당신의 취향을 분석하고 서울의 진짜 박동을 연결해주는 유일한 AI 컬처 가이드" />
    <meta name="keywords" content="Seoul, travel, local guide, AI, Korea, tips" />
    <meta property="og:title" content="로컬리 - Seoul AI Guide" />
    <meta property="og:description" content="Flow like a local. Seoul, Decoded." />
    <meta property="og:type" content="website" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <title>로컬리 — 현지인 꿀팁 AI 번역 플랫폼</title>

    <!-- Prevent flash of wrong theme -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('lf_theme') || 'dark';
          if (t === 'dark') document.documentElement.classList.add('dark');
        } catch(e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
